name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          cache: pnpm
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff
      - run: sudo npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - id: release
        run: |
          VERSION=$(git cliff --bumped-version)
          VERSION=${VERSION#v}
          if [[ -z "$VERSION" ]]; then
            echo "No commits since the latest release"
            exit 0
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          git cliff --tag "v$VERSION" --output /tmp/release-notes.md
          git cliff --tag "v$VERSION" --output CHANGELOG.md
          npm version "$VERSION" --no-git-tag-version
          pnpm lint
          pnpm build:minify
          pnpm pack
          pnpm publish --no-git-checks --provenance
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md package.json
          git commit -m "chore(release): $VERSION [skip ci]"
          git tag "v$VERSION"
          git push origin main --tags
          gh release create "v$VERSION" --title "v$VERSION" --notes-file /tmp/release-notes.md d1g1tal-subscribr-*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
